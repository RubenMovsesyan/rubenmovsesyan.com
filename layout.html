<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The shell every page of the blog shares. Trunk builds only this file;
       crates/astronomy-pages then writes each page in pages/ into it: the
       title, the description, and the content at the page:content marker
       below. Paths are absolute because entries live in subdirectories. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astronomical Observations</title>
  <meta name="description" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap">

  <link data-trunk rel="css" href="assets/css/base.css">
  <link data-trunk rel="css" href="assets/css/notebook.css">
  <!-- The handwriting font, and the blank font for figures' copy text. -->
  <link data-trunk rel="copy-dir" href="assets/fonts">
  <link data-trunk rel="copy-dir" href="assets/textures">
  <link data-trunk rel="rust" href="crates/astronomy-site/Cargo.toml" data-wasm-opt="z">
</head>
<body>

  <!-- ─── The sky we are observing from ───────────────────────────────── -->
  <div class="sky-stage">
    <section class="hero">
      <!-- Animated starfield, rendered by crates/astronomy-site/src/starfield.rs. -->
      <canvas class="sky" data-orrery="starfield" aria-hidden="true"></canvas>

      <div class="hero-plate">
        <h1 class="hero-title">Astronomical Observations</h1>
        <p class="hero-sub">Field Notes from the Eyepiece</p>
      </div>

      <div class="hero-fade" aria-hidden="true"></div>
    </section>

    <!-- Sits above the sky, below the notebook: the lower third is covered
         by the parchment, which is what puts it "behind the page". Drawn in
         3D from assets/models/telescope.glb by
         crates/astronomy-site/src/telescope.rs (WebGPU, or WebGL2). -->
    <div class="telescope-glow" aria-hidden="true"></div>
    <canvas class="telescope" data-orrery="telescope" aria-hidden="true"></canvas>
  </div>

  <!-- ─── The notebook ────────────────────────────────────────────────── -->
  <main class="notebook">
    <!-- The torn top edge: assets/textures/torn-edge-mask.png (built by
         tools/torn_edge.py from torn-paper.png) cut from the page colour. -->
    <div class="notebook-edge" aria-hidden="true"></div>

    <!-- Shared <defs> for every sketch on the page. Keeping the filter in one
         place avoids duplicate ids once there is more than one drawing. -->
    <svg class="sketch-defs" aria-hidden="true" focusable="false">
      <defs>
        <!-- Pushes strokes around by a little noise, so ruled geometry comes
             out looking drawn by hand. -->
        <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.028"
                        numOctaves="3" seed="11" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4"
                             xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <div class="page">
      <p class="page-meta">Observationes Astronomicae &middot; Anno Domini MDCXI</p>

<!-- page:content -->
    </div>
  </main>

</body>
</html>
