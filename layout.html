<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The shell every page of the blog shares. Trunk builds only this file;
       crates/astronomy-pages then writes each page in pages/ into it: the
       title, the description, and the content at the page:content marker
       below. Paths are absolute because entries live in subdirectories. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astronomical Observations</title>
  <meta name="description" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&amp;family=Kalam:wght@300;400;700&amp;display=swap">

  <link data-trunk rel="css" href="assets/css/base.css">
  <link data-trunk rel="css" href="assets/css/notebook.css">
  <link data-trunk rel="copy-file" href="assets/telescope.svg">
  <!-- Handwriting font test scaffolding; see /hand-preview.html. Remove both
       lines once the font question is settled. -->
  <link data-trunk rel="copy-file" href="assets/hand-preview.html">
  <link data-trunk rel="copy-dir" href="assets/fonts">
  <link data-trunk rel="rust" href="crates/astronomy-site/Cargo.toml" data-wasm-opt="z">
</head>
<body>

  <!-- Temporary: switch the body text between Kalam and the scanned hand.
       Remove with the rest of the font-test scaffolding. -->
  <input type="checkbox" id="hw-toggle" class="hw-toggle" checked>
  <label for="hw-toggle" class="hw-label"></label>

  <!-- ─── The sky we are observing from ───────────────────────────────── -->
  <div class="sky-stage">
    <section class="hero">
      <!-- Animated starfield, rendered by crates/astronomy-site/src/starfield.rs. -->
      <canvas class="sky" data-orrery="starfield" aria-hidden="true"></canvas>

      <div class="hero-plate">
        <h1 class="hero-title">Astronomical Observations</h1>
        <p class="hero-sub">Field Notes from the Eyepiece</p>
      </div>

      <div class="hero-fade" aria-hidden="true"></div>
    </section>

    <!-- Sits above the sky, below the notebook: the lower third is covered
         by the parchment, which is what puts it "behind the page". -->
    <img class="telescope" src="/telescope.svg" alt="" aria-hidden="true">
  </div>

  <!-- ─── The notebook ────────────────────────────────────────────────── -->
  <main class="notebook">
    <div class="notebook-edge" aria-hidden="true">
      <svg viewBox="0 0 100 10" preserveAspectRatio="none">
        <defs>
          <linearGradient id="parchment-top" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b8954a"/>
            <stop offset="100%" stop-color="#d4b87a"/>
          </linearGradient>
        </defs>
        <path d="M0 0 L2 3 L5 1 L9 4 L14 1.5 L18 4 L23 2 L28 5 L33 1 L38 3.5 L42 1 L47 4
                 L52 2 L57 5 L61 1.5 L66 4 L70 2 L75 5 L79 1 L84 3.5 L88 2 L93 4 L97 1.5
                 L100 3 L100 10 L0 10 Z" fill="url(#parchment-top)"/>
      </svg>
    </div>

    <!-- Shared <defs> for every sketch on the page. Keeping the filter in one
         place avoids duplicate ids once there is more than one drawing. -->
    <svg class="sketch-defs" aria-hidden="true" focusable="false">
      <defs>
        <!-- Pushes strokes around by a little noise, so ruled geometry comes
             out looking drawn by hand. -->
        <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.028"
                        numOctaves="3" seed="11" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4"
                             xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <div class="page">
      <p class="page-meta">Observationes Astronomicae &middot; Anno Domini MDCXI</p>

<!-- page:content -->

      <p class="finis">&#10022; &nbsp; finis &nbsp; &#10022;</p>
    </div>
  </main>

</body>
</html>
