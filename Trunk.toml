[build]
# Trunk builds one HTML file per run: the shell every page shares. The
# post_build hook below turns it into the real pages (see layout.html).
target = "layout.html"
html_output = "_layout.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

# Watch only what the build actually reads. Anything else in the tree -- the
# font pipeline in tools/ and its __pycache__, say -- would otherwise trigger
# a rebuild, and trunk tells every open page to reload on each one.
[watch]
watch = [
  "layout.html",
  "pages",
  "crates",
  "assets/css",
  "assets/fonts",
  "assets/figures",
  "assets/textures",
  "assets/models",
  "Cargo.toml",
  "Cargo.lock",
]
# Only directories that always exist: trunk refuses to start if an ignored
# path is missing.
ignore = ["dist", "target", "tools", "scripts"]

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "echo '[trunk] building astronomy-site wasm…'"]

# Writes index.html (the contents) and entries/<slug>/index.html from
# _layout.html and pages/, then removes _layout.html. Standard library only,
# so after the first run it builds in a moment.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "--package", "astronomy-pages"]
