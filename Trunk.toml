[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

# Watch only what the build actually reads. Anything else in the tree -- the
# font pipeline in tools/ and its __pycache__, the 65MB source photographs in
# assets/img -- would otherwise trigger a rebuild, and trunk tells every open
# page to reload on each one.
[watch]
watch = [
  "index.html",
  "src",
  "assets/css",
  "assets/fonts",
  "assets/figures",
  "assets/hand-preview.html",
  "assets/telescope.svg",
  "Cargo.toml",
  "Cargo.lock",
]
# Only directories that always exist: trunk refuses to start if an ignored
# path is missing. assets/img and assets/tests (the DNGs, left out of the
# checkout) are simply never watched.
ignore = ["dist", "target", "tools", "scripts"]

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "echo '[trunk] building orrery wasm…'"]
