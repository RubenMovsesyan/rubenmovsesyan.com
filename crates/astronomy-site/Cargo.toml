[package]
name = "astronomy-site"
version = "0.1.0"
edition = "2021"
description = "Shared browser code for every page of the astronomy blog: starfield, reveals, figure links"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Window",
  "Performance",
  "DomRect",
  "CssStyleDeclaration",
  "Event",
  "MouseEvent",
  "IntersectionObserver",
  "IntersectionObserverInit",
  "IntersectionObserverEntry",
  "NodeList",
  "DomTokenList",
  "History",
  "Location",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
]
